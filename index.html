
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Group Diesel Fleet Management</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#142b4a;color:white;padding:18px}
.container{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 9px #0001}
input,select,button{padding:11px;margin:6px 0;width:100%;border:1px solid #cbd5e1;border-radius:6px}
button{background:#1455a0;color:white;border:0;cursor:pointer;font-weight:bold}
button.danger{background:#c62828}
button.success{background:#16834a}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:#eaf2ff;padding:15px;border-radius:9px}
.stat h2{margin:5px 0}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:10px;border:1px solid #ddd;text-align:left}
th{background:#eaf0f7}
.tablewrap{overflow-x:auto}
.small{font-size:13px;color:#64748b}
</style>
</head>

<body>

<header>
<h2>AR GROUP - DIESEL FLEET MANAGEMENT</h2>
<p>Bus Diesel Management System</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPanel" class="card">
<h2>Login</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage"></p>
</div>

<!-- DRIVER -->
<div id="driverPanel" class="hidden">

<div class="card">
<h2>Driver Diesel Entry</h2>
<button onclick="logout()">Logout</button>

<label>Date</label>
<input type="date" id="date">

<label>Bus Number</label>
<input id="bus" placeholder="BUS-01">

<label>Route</label>
<input id="route" placeholder="Pune-Goa">

<label>Meter KM</label>
<input type="number" id="km">

<label>Diesel Litres</label>
<input type="number" id="litres" step="0.01">

<label>Diesel Rate</label>
<input type="number" id="rate" step="0.01">

<label>Tank Status</label>
<select id="tank">
<option>Full Tank</option>
<option>Partial Tank</option>
</select>

<label>Meter Photo</label>
<input type="file" id="meterPhoto" accept="image/*">

<label>Diesel Pump Bill Photo</label>
<input type="file" id="pumpPhoto" accept="image/*">

<button onclick="submitEntry()">Submit Diesel Entry</button>
<p id="entryMessage"></p>
</div>

</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden">

<div class="card">
<h2>Admin Dashboard</h2>
<button onclick="loadAdmin()">Refresh Dashboard</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Fleet Summary</h3>
<div class="grid" id="summary"></div>
</div>

<div class="card">
<h3>Bus-wise Report</h3>
<div class="tablewrap" id="busSummary"></div>
</div>

<div class="card">
<h3>Route-wise Report</h3>
<div class="tablewrap" id="routeSummary"></div>
</div>

<div class="card">
<h3>Diesel Entries</h3>
<div class="tablewrap" id="entries"></div>
</div>

</div>
</div>

<script>
let token = localStorage.getItem("token") || "";
let currentRole = "";

async function api(url, options={}) {
    options.headers = options.headers || {};
    if(token) options.headers["Authorization"] = "Bearer " + token;

    let response = await fetch(url, options);
    let data = await response.json().catch(() => ({}));

    if(!response.ok) {
        throw new Error(data.detail || "Request failed");
    }
    return data;
}

function showPanel(role) {
    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("driverPanel").classList.add("hidden");
    document.getElementById("adminPanel").classList.add("hidden");

    if(role === "driver") {
        document.getElementById("driverPanel").classList.remove("hidden");
    } else {
        document.getElementById("adminPanel").classList.remove("hidden");
        loadAdmin();
    }
}

async function login() {
    const message = document.getElementById("loginMessage");
    message.textContent = "Logging in...";

    try {
        const body = new URLSearchParams();
        body.append("username", document.getElementById("username").value);
        body.append("password", document.getElementById("password").value);

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type":"application/x-www-form-urlencoded"},
            body: body
        });

        const data = await response.json();

        if(!response.ok) {
            throw new Error(data.detail || "Login failed");
        }

        token = data.access_token;
        localStorage.setItem("token", token);

        const user = await api("/api/me");
        currentRole = user.role;
        showPanel(user.role);

    } catch(error) {
        message.textContent = error.message;
    }
}

function logout() {
    token = "";
    currentRole = "";
    localStorage.removeItem("token");

    document.getElementById("loginPanel").classList.remove("hidden");
    document.getElementById("driverPanel").classList.add("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
}

async function submitEntry() {
    const message = document.getElementById("entryMessage");

    try {
        const form = new FormData();

        form.append("date", document.getElementById("date").value);
        form.append("bus_number", document.getElementById("bus").value);
        form.append("route", document.getElementById("route").value);
        form.append("meter_km", document.getElementById("km").value);
        form.append("litres", document.getElementById("litres").value);
        form.append("rate", document.getElementById("rate").value);
        form.append("tank_status", document.getElementById("tank").value);

        const meter = document.getElementById("meterPhoto").files[0];
        const pump = document.getElementById("pumpPhoto").files[0];

        if(!meter || !pump) {
            throw new Error("Both photos are required");
        }

        form.append("meter_photo", meter);
        form.append("pump_photo", pump);

        await api("/api/driver/entries", {
            method:"POST",
            body:form
        });

        message.textContent = "Entry submitted successfully";
    } catch(error) {
        message.textContent = error.message;
    }
}

function makeTable(headers, rows) {
    let html = "<table><thead><tr>";

    headers.forEach(h => {
        html += "<th>" + h + "</th>";
    });

    html += "</tr></thead><tbody>";

    rows.forEach(row => {
        html += "<tr>";
        row.forEach(cell => {
            html += "<td>" + (cell ?? "") + "</td>";
        });
        html += "</tr>";
    });

    html += "</tbody></table>";
    return html;
}

async function review(id, status) {
    try {
        await api("/api/admin/entries/" + id + "/review", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({status:status})
        });

        await loadAdmin();
    } catch(error) {
        alert(error.message);
    }
}

async function loadAdmin() {
    try {
        const entries = await api("/api/admin/entries");

        let rows = [];

        entries.forEach(e => {
            let actions = "";

            if(e.status === "pending") {
                actions =
                    '<button onclick="review(' + e.id + ',\'approved\')">Approve</button>' +
                    '<button class="danger" onclick="review(' + e.id + ',\'rejected\')">Reject</button>';
            }

            rows.push([
                e.date,
                e.bus_number,
                e.route,
                e.driver_name,
                e.meter_km,
                e.litres,
                e.rate,
                e.status,
                actions
            ]);
        });

        document.getElementById("entries").innerHTML =
            makeTable(
                ["Date","Bus","Route","Driver","KM","Litres","Rate","Status","Action"],
                rows
            );

        const s = await api("/api/admin/summary");

        const totals = s.status_totals || [];
        let totalLitres = 0;
        let totalCost = 0;

        totals.forEach(item => {
            totalLitres += Number(item.total_litres || 0);
            totalCost += Number(item.total_cost || 0);
        });

        document.getElementById("summary").innerHTML =
            '<div class="stat"><p>Total Diesel</p><h2>' + totalLitres.toFixed(2) + ' L</h2></div>' +
            '<div class="stat"><p>Total Expense</p><h2>₹' + totalCost.toFixed(2) + '</h2></div>';

        const busRows = (s.bus_totals || []).map(item => [
            item.bus_number,
            item.total_litres,
            item.total_cost
        ]);

        document.getElementById("busSummary").innerHTML =
            makeTable(["Bus","Litres","Expense"], busRows);

        const routeRows = (s.route_totals || []).map(item => [
            item.route,
            item.total_litres,
            item.total_cost
        ]);

        document.getElementById("routeSummary").innerHTML =
            makeTable(["Route","Litres","Expense"], routeRows);

    } catch(error) {
        document.getElementById("entries").textContent = error.message;
    }
}

async function restoreSession() {
    if(!token) return;

    try {
        const user = await api("/api/me");
        currentRole = user.role;
        showPanel(user.role);
    } catch(error) {
        logout();
    }
}

restoreSession();
</script>

</body>
</html>
